# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Aj De Guzman
email: aljohndeguzman@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Thoughts on everything software development, running, environment and life.
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com
tagline:
profile_image: /assets/profile-dithered.png

# Order of the links in the site header. Only pages listed here appear.
header_pages:
  - about.md
  - life.md
  - projects.md
  - notebook.md
  - talks.md
  - races.md


# Analytics. GoatCounter is cookie-free, so no consent banner is needed.
# Only rendered when jekyll.environment == 'production' (see _includes/head.html),
# so local `jekyll serve` traffic is not counted.
goatcounter: ajdeguzman

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed

minima:
  social_links:
    # twitter: jekyllrb
    github: ajdeguzman
    # dribbble: jekyll
    # facebook: jekyll
    # flickr: jekyll
    # instagram: jekyll
    linkedin: aljohn-de-guzman-4b5b8257
    # pinterest: jekyll
    # telegram: jekyll
    strava: ajdeguzman
    # microdotblog: jekyll
    # rss: rss

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Comments, via Utterances (https://utteranc.es/) — each article's thread is a
# GitHub Issue on this repo. Two one-time prerequisites: install the utterances
# GitHub App on the repo, and keep the repo public with Issues enabled.
#
# Posts get comments automatically. Pages opt in with `comments: true` in their
# front matter; any post or page can opt out with `comments: false`.
utterances:
  repo: ajdeguzman/ajdeguzman.github.io
  issue_term: pathname      # thread is matched to the page's URL path
  label: comment            # label applied to the created issues
  theme: github-light       # the site has no dark mode

# Words left lowercase when the gallery Title Cases a filename (unless they
# land first or last). Edit to taste.
# NB: quoted — YAML reads bare on/off/yes/no as booleans, so "on" would
# otherwise become true and never match.
title_case_minor_words: ["a", "an", "and", "as", "at", "but", "by", "for", "from",
                         "in", "nor", "of", "on", "or", "the", "to", "via", "vs", "with"]

# Jekyll's own defaults are REPLACED (not extended) when this key is set, so the
# stock entries are repeated here. vendor/ matters: that's where bundler installs
# gems locally, and it must never be copied into _site.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  - .bundle/
  - script/
  - assets/races/README.md   # notes for me, not a page (jekyll-readme-index would publish it)
