---
layout: default
---

<div class="home">
  <h1 class="section-heading">Writing</h1>

  {%- if site.posts.size > 0 -%}
    <ul class="home-post-list">
      {%- for post in site.posts -%}
        <li>
          <time class="post-meta" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %Y" }}</time>
          <a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a>
        </li>
      {%- endfor -%}
    </ul>
  {%- else -%}
    <p>No posts yet.</p>
  {%- endif -%}
</div>
