{%- comment -%}
  Disqus comments (https://disqus.com/).

  Renders only when site.disqus.shortname is set. A post or page can turn it
  off with `comments: false` in its front matter.
{%- endcomment -%}

{%- if site.disqus.shortname.size > 0 and page.comments != false -%}
<section class="comments" id="comments" aria-label="Comments">
  <h2 class="comments-heading">Comments</h2>
  <div id="disqus_thread"></div>

  <script>
    var disqus_config = function () {
      this.page.url = {{ page.url | absolute_url | jsonify }};
      this.page.identifier = {{ page.url | jsonify }};
      this.page.title = {{ page.title | jsonify }};
    };

    (function () {
      var d = document;
      var s = d.createElement('script');
      s.src = 'https://{{ site.disqus.shortname }}.disqus.com/embed.js';
      s.setAttribute('data-timestamp', String(+new Date()));
      (d.head || d.body).appendChild(s);
    }());
  </script>

  <noscript>
    Please enable JavaScript to view the
    <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus</a>.
  </noscript>
</section>
{%- endif -%}
