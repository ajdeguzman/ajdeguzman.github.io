<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper">

    <div class="footer-col-wrapper">
      <div class="footer-col one-half">
        {%- if site.email -%}
        <p class="footer-heading"><a class="u-email" href="mailto:{{ site.email }}">{{ site.email }}</a></p>
        {%- endif -%}
        <p>&copy; {{ 'now' | date: "%Y" }} {{ site.title | escape }}</p>
      </div>

      <div class="footer-col one-half footer-tagline">
        <p>{{- site.description | escape -}}</p>
        <div class="social-links">
          {%- include social.html -%}
        </div>
      </div>
    </div>

  </div>

</footer>
