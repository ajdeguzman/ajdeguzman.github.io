<nav class="post-toc" aria-labelledby="post-toc-title" hidden>
  <p class="post-toc-title" id="post-toc-title">On this page</p>
  <ol class="post-toc-list"></ol>
</nav>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    var toc = document.querySelector(".post-toc");
    var content = document.querySelector(".post-content");
    if (!toc || !content) return;

    var headings = Array.prototype.slice.call(content.querySelectorAll("h2, h3"));
    if (!headings.length) return;

    var list = toc.querySelector(".post-toc-list");
    var links = [];

    headings.forEach(function (heading, index) {
      if (!heading.id) heading.id = "section-" + (index + 1);

      var item = document.createElement("li");
      var link = document.createElement("a");

      item.className = "post-toc-level-" + heading.tagName.toLowerCase();
      link.href = "#" + encodeURIComponent(heading.id);
      link.textContent = heading.textContent;
      item.appendChild(link);
      list.appendChild(item);
      links.push(link);
    });

    toc.hidden = false;

    var ticking = false;
    function setCurrentSection() {
      var current = 0;
      headings.forEach(function (heading, index) {
        if (heading.getBoundingClientRect().top <= 120) current = index;
      });

      links.forEach(function (link, index) {
        if (index === current) {
          link.setAttribute("aria-current", "location");
        } else {
          link.removeAttribute("aria-current");
        }
      });
      ticking = false;
    }

    window.addEventListener("scroll", function () {
      if (!ticking) {
        window.requestAnimationFrame(setCurrentSection);
        ticking = true;
      }
    }, { passive: true });

    setCurrentSection();
  });
</script>
